  .cg-offer {
    --white: #ffffff;
    --ink: #1e2420;
    --body: #626b66;

    --gold: #d3aa6e;
    --gold-bg: #f5ead7;

    z-index: 1;
    background: var(--white);
    font-family: "Poppins", -apple-system, sans-serif;
    color: var(--body);
    padding: clamp(70px, 8vw, 120px) clamp(18px, 3.5vw, 52px)
      clamp(80px, 9vw, 140px);
    overflow: hidden;

  .cg-offer *,

    box-sizing: border-box;
    margin: 0;
    padding: 0;

  .cg-offer .wrap {
    max-width: 1400px;
    margin: 0 auto;
  }
  .cg-offer .head {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: clamp(28px, 4vw, 80px);
    align-items: end;
    margin-bottom: clamp(30px, 3.5vw, 48px);

  .cg-offer .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--green);
    border: 1.5px solid rgba(29, 74, 58, 0.22);
    border-radius: 999px;
    padding: 10px 22px;
    margin-bottom: 30px;
    opacity: 0;
    transform: translateY(14px);
    transition:
      opacity 0.8s var(--ease),
      transform 0.8s var(--ease);

    var beginHtml = "<section class=\"cg-begin\" id=\"contact\"><div class=\"panel\" data-reveal><div class=\"glow\" aria-hidden=\"true\"></div><span class=\"whisper\" aria-hidden=\"true\" data-parallax=\"0.04\">let's talk</span><span class=\"blob a\" data-parallax=\"-0.05\"></span><span class=\"blob b\" data-parallax=\"0.06\"></span><div class=\"inner\"><p class=\"eyebrow\">Ready to Begin?</p><h2 aria-label=\"Your Organization Deserves to Thrive\"><span class=\"w\"><span>Your</span></span> <span class=\"w\"><span>Organization</span></span><br/><span class=\"w\"><span>Deserves</span></span> <span class=\"w\"><span>to</span></span> <span class=\"w\"><span class=\"script\">Thrive<svg viewBox=\"0 0 200 14\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"stroke\" d=\"M4 10 C 60 2, 140 2, 196 8\"/></svg></span></span></h2><p class=\"lede\">Whether you're looking for executive coaching, a board intensive, a team retreat, or full implementation of the <strong>Zero Turnover™</strong> program — the first step is a conversation.</p><div class=\"actions\"><a class=\"orbit\" href=\"mailto:hello@carriegrace.consulting\" data-magnetic aria-label=\"Schedule a Discovery Call\"><svg class=\"ring\" viewBox=\"0 0 210 210\" aria-hidden=\"true\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><defs><path id=\"cg-orbit\" d=\"M105,105 m-92,0 a92,92 0 1,1 184,0 a92,92 0 1,1 -184,0\"/></defs><text><textPath xlink:href=\"#cg-orbit\">Schedule a Discovery Call · Schedule a Discovery Call ·</textPath></text></svg><span class=\"disc\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12h15m0 0-6-6m6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></span></a><a class=\"secondary\" href=\"#services\">Review Services First<svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 4v15m0 0-6-6m6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></a></div></div></div></section>";

    function initBeginSection() {
      var root = document.querySelector(".cg-begin");
      if (!root || root.dataset.cgBeginInit) return;
      root.dataset.cgBeginInit = "1";

      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var panel = root.querySelector("[data-reveal]");
      var stroke = root.querySelector("h2 .script path");
      if (!panel) return;

      if (stroke && !reduce) {
        var L = stroke.getTotalLength();
        stroke.style.strokeDasharray = L;
        stroke.style.strokeDashoffset = L;
        stroke.style.transition =
          "stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1) .9s";
      }

      function arm() {
        panel.classList.add("in");
        if (stroke && !reduce) {
          requestAnimationFrame(function () {
            stroke.style.strokeDashoffset = 0;
          });
        }
      }

      if (!("IntersectionObserver" in window) || reduce) {
        arm();
      } else {
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting) {
                arm();
                io.unobserve(e.target);
              }
            });
          },
          { threshold: 0.25 },
        );
        io.observe(panel);
      }

      if (reduce) return;

      if (matchMedia("(pointer:fine)").matches) {
        panel.addEventListener("pointermove", function (e) {
          var r = panel.getBoundingClientRect();
          panel.style.setProperty(
            "--mx",
            ((e.clientX - r.left) / r.width) * 100 + "%",
          );
          panel.style.setProperty(
            "--my",
            ((e.clientY - r.top) / r.height) * 100 + "%",
          );
          panel.classList.add("lit");
        });
        panel.addEventListener("pointerleave", function () {
          panel.classList.remove("lit");
        });
      }

      var orbit = root.querySelector(".orbit");
      if (!orbit) return;
      var ring = orbit.querySelector(".ring");
      var angle = 0,
        speed = 0.12,
        target = 0.12,
        running = false;

      function spin() {
        speed += (target - speed) * 0.06;
        angle = (angle + speed) % 360;
        if (ring) ring.style.transform = "rotate(" + angle + "deg)";
        if (running) requestAnimationFrame(spin);
      }

      var vis = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (e) {
            running = e.isIntersecting;
            if (running) requestAnimationFrame(spin);
          });
        },
        { threshold: 0 },
      );
      vis.observe(orbit);

      orbit.addEventListener("mouseenter", function () {
        target = 0.55;
      });
      orbit.addEventListener("mouseleave", function () {
        target = 0.12;
      });

      if (matchMedia("(pointer:fine)").matches) {
        var MAX = 14,
          strength = 0.16;
        function clampPull(v) {
          return Math.max(-MAX, Math.min(MAX, v));
        }
        orbit.addEventListener("mousemove", function (e) {
          var r = orbit.getBoundingClientRect();
          orbit.style.transform =
            "translate(" +
            clampPull((e.clientX - (r.left + r.width / 2)) * strength) +
            "px," +
            clampPull((e.clientY - (r.top + r.height / 2)) * strength) +
            "px)";
        });
        orbit.addEventListener("mouseleave", function () {
          orbit.style.transition = "transform .6s cubic-bezier(.22,1,.36,1)";
          orbit.style.transform = "translate(0,0)";
          setTimeout(function () {
            orbit.style.transition = "";
          }, 600);
        });
      }

      var layers = root.querySelectorAll("[data-parallax]");
      var ticking = false;
      window.addEventListener(
        "scroll",
        function () {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () {
            var r = panel.getBoundingClientRect();
            var prog = window.innerHeight - r.top;
            layers.forEach(function (el) {
              var s = parseFloat(el.getAttribute("data-parallax")) || 0;
              el.style.transform = "translateY(" + prog * s + "px)";
            });
            ticking = false;
          });
        },
        { passive: true },
      );
    }

    function ensureBeginSection() {
      var begin = document.querySelector(".cg-begin");
      if (begin && begin.querySelector(".orbit")) {
        initBeginSection();
        return;
      }
      var processEl = document.querySelector(".cg-process");
      var processBlock = processEl
        ? processEl.closest(".Content_Content__Pm8xD")
        : null;
      var template = document.createElement("template");
      template.innerHTML =
        '<section class="Content_Content__Pm8xD">' +
        '<div class="container Content_Cont__FZxhO">' +
        "<h2></h2>" +
        '<div class="Content_Copy__Ie90_">' +
        beginHtml +
        "</div></div></section>";
      var block = template.content.firstChild;
      if (processBlock && processBlock.parentElement) {
        processBlock.insertAdjacentElement("afterend", block);
        initBeginSection();
      }
    }

    var footerHtml = "<footer class=\"cg-footer\"><span class=\"corner\"><button class=\"top-btn\" type=\"button\" aria-label=\"Back to top\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 20V5m0 0-6 6m6-6 6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></button></span><div class=\"base\" data-reveal><div class=\"inner\"><div class=\"cols\"><div class=\"col\" style=\"--i:0\"><a class=\"logo\" href=\"#top\">Carrie Grace</a><p class=\"blurb\">Nonprofit consulting built on trust — helping mission-driven organizations achieve <em>zero turnover, zero burnout,</em> and cultures where people stay.</p><div class=\"socials\"><a href=\"https://www.linkedin.com/in/carrie-grace-28199826b/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"LinkedIn\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.22 8.09h4.56V23H.22V8.09zM8.34 8.09h4.37v2.04h.06c.61-1.15 2.1-2.37 4.32-2.37 4.62 0 5.47 3.04 5.47 6.99V23h-4.55v-7.28c0-1.74-.03-3.97-2.42-3.97-2.42 0-2.79 1.89-2.79 3.84V23H8.34V8.09z\"/></svg></a><a href=\"https://www.instagram.com/carriegracelife/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Instagram\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><rect x=\"2.5\" y=\"2.5\" width=\"19\" height=\"19\" rx=\"5.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.4\"/><circle cx=\"17.6\" cy=\"6.4\" r=\"1.15\" fill=\"currentColor\" stroke=\"none\"/></svg></a></div></div><nav class=\"col\" style=\"--i:1\" aria-label=\"Explore\"><h4>Explore</h4><ul><li><a href=\"#services\">Services</a></li><li><a href=\"/about\">About</a></li><li><a href=\"#resources\">Resources</a></li><li><a href=\"#programs\">Programs</a></li><li><a href=\"/contact\">Contact</a></li></ul></nav><nav class=\"col\" style=\"--i:2\" aria-label=\"Services\"><h4>Services</h4><ul><li><a href=\"/services/executive-consulting\">Executive Consulting</a></li><li><a href=\"/services/executive-consulting\">Executive &amp; Board Consulting</a></li><li><a href=\"/services/team-development-care\">Team Development, Care &amp; Retreats</a></li><li><a href=\"/services/organizational-structure-setup\">Organizational Structure</a></li><li><a href=\"/zero-turnover\">Zero Turnover™ Program</a></li></ul></nav><div class=\"col\" style=\"--i:3\"><h4>Start the Conversation</h4><a class=\"email\" href=\"mailto:hello@carriegrace.consulting\">hello@carriegrace.consulting</a><p class=\"loc\">Serving nonprofits nationwide</p></div></div><div class=\"bar\"><p>© 2026 Carrie Grace Consulting. All rights reserved.</p><div class=\"legal\"><a href=\"#privacy\">Privacy Policy</a><a href=\"#terms\">Terms of Service</a></div></div></div><div class=\"signature\" aria-hidden=\"true\"><span data-parallax>Carrie Grace</span></div></div></footer>";

    function initFooterSection() {
      var root = document.querySelector(".cg-footer");
      if (!root || root.dataset.cgFooterInit) return;
      root.dataset.cgFooterInit = "1";

      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var base = root.querySelector("[data-reveal]");
      if (!base) return;

      if (!("IntersectionObserver" in window) || reduce) {
        base.classList.add("in");
      } else {
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                io.unobserve(e.target);
              }
            });
          },
          { threshold: 0.15 },
        );
        io.observe(base);
      }

      var topBtn = root.querySelector(".top-btn");
      if (topBtn) {
        topBtn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
        });
      }
    }

    function ensureFooterSection() {
      var footer = document.querySelector(".cg-footer");
      if (footer && footer.querySelector(".base")) {
        initFooterSection();
        return;
      }
      var beginEl = document.querySelector(".cg-begin");
      var beginBlock = beginEl
        ? beginEl.closest(".Content_Content__Pm8xD")
        : null;
      var template = document.createElement("template");
      template.innerHTML =
        '<section class="Content_Content__Pm8xD">' +
        '<div class="container Content_Cont__FZxhO">' +
        "<h2></h2>" +
        '<div class="Content_Copy__Ie90_">' +
        footerHtml +
        "</div></div></section>";
      var block = template.content.firstChild;
      if (beginBlock && beginBlock.parentElement) {
        beginBlock.insertAdjacentElement("afterend", block);
        initFooterSection();
        return;
      }
      var main = document.querySelector("main");
      if (main) {
        main.appendChild(block);
        initFooterSection();
      }
    }

    function ensureAboutSection() {
      var about = document.querySelector(".cg-about");
      if (about && about.querySelector(".cg-about__grid")) return;

      var shell = document.querySelector(".cg-hero-sticky-shell");
      var hero = document.querySelector(".HomeHero_HomeHero__dzWAE");
      var introSections = Array.prototype.slice.call(
        document.querySelectorAll(".Content_Content__Pm8xD"),
      );
      var intro = introSections.find(function (section) {
        return !section.querySelector(".cg-about");
      });
      var template = document.createElement("template");
      template.innerHTML =
        '<section class="Content_Content__Pm8xD">' +
        '<div class="container Content_Cont__FZxhO">' +
        "<h2></h2>" +
        '<div class="Content_Copy__Ie90_">' +
        aboutHtml +
        "</div></div></section>";
      var block = template.content.firstChild;

      if (intro && intro.parentElement) {
        intro.parentElement.insertBefore(block, intro.nextSibling);
        return;
      }

      if (shell && shell.parentElement) {
        shell.insertAdjacentElement("afterend", block);
        return;
      }

      if (hero && hero.parentElement) {
        hero.insertAdjacentElement("afterend", block);
      }
    }

    function ensureHeroImage() {
      var main = document.querySelector(".HomeHero_Main__Gkusx");
      if (!main) return;

      var jarallax = main.querySelector(":scope > section.jarallax");
      var src = heroImageSrc;

      if (jarallax) {
        var match = (jarallax.getAttribute("style") || "").match(
          /url\(["']?([^"')]+)/,
        );
        if (match) src = match[1];
        try {
          if (
            jarallax.jarallax &&
            typeof jarallax.jarallax.destroy === "function"
          ) {
            jarallax.jarallax.destroy();
          }
        } catch (e) {}
        jarallax.remove();
      }

      main.querySelectorAll(":scope > video").forEach(function (el) {
        el.remove();
      });

      var cover = main.querySelector(":scope > img.hero-cover");
      if (!cover) {
        cover = document.createElement("img");
        cover.className = "hero-cover";
        cover.src = src;
        cover.alt = "";
        main.insertBefore(cover, main.firstChild);
      } else if (cover.getAttribute("src") !== src) {
        cover.setAttribute("src", src);
      }
    }

    function ensureLogo() {
      document.querySelectorAll(headerLogoSelector).forEach(function (span) {
        span.querySelectorAll("svg, img").forEach(function (node) {
          node.remove();
        });
      });
    }

    function observeLogo() {
      document
        .querySelectorAll(headerLogoContainerSelector)
        .forEach(function (logo) {
          if (logo.dataset.cgLogoObserved) return;
          logo.dataset.cgLogoObserved = "1";
          ensureLogo();
          new MutationObserver(ensureLogo).observe(logo, {
            childList: true,
            subtree: true,
          });
        });
    }

    function ensureTitle() {
      if (document.title !== pageTitle) {
        document.title = pageTitle;
      }
      var titleEl = document.querySelector("head title");
      if (titleEl && titleEl.textContent !== pageTitle) {
        titleEl.textContent = pageTitle;
      }
    }

    function observeTitle() {
      if (document.documentElement.dataset.cgTitleObserved) return;
      document.documentElement.dataset.cgTitleObserved = "1";
      ensureTitle();
      new MutationObserver(ensureTitle).observe(document.head, {
        childList: true,
        subtree: true,
        characterData: true,
      });
    }

    function removeFooter() {
      document
        .querySelectorAll('[class*="Footer_Footer"]')
        .forEach(function (el) {
          el.remove();
        });
    }

    function ensureRemoveRetreatsService() {
      document
        .querySelectorAll('a[href="/services/team-building-retreats"]')
        .forEach(function (link) {
          var card = link.closest(".card");
          if (card) {
            card.remove();
            return;
          }
          var item = link.closest("li");
          if (item) item.remove();
        });

      document.querySelectorAll(".Menu_Submenu___nIdT a, .Menu_MobileSubmenu__u1our a").forEach(function (link) {
        if (link.getAttribute("href") === "/services/team-building-retreats") {
          var item = link.closest("li");
          if (item) item.remove();
        }
      });
    }

    function ensureSocialLinks() {
      var linkedIn = "https://www.linkedin.com/in/carrie-grace-28199826b/";
      var instagram = "https://www.instagram.com/carriegracelife/";
      var selector =
        ".Header_SocialsMobile__0QYKc a, .Menu_Menu___Nwdq > ul > li.social a";

      document.querySelectorAll(selector).forEach(function (link) {
        var label = (link.getAttribute("aria-label") || "").toLowerCase();
        if (label.indexOf("linkedin") !== -1) {
          link.href = linkedIn;
        } else if (label.indexOf("instagram") !== -1) {
          link.href = instagram;
        } else {
          return;
        }
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      });
    }

    function syncPage() {
      try {
        disableLenisForSticky();
        ensureStickyShell();
        ensureAboutSection();
        ensureOfferSection();
        ensureProgramSection();
        ensureResourcesSection();
        ensureVoicesSection();
        ensureExpertiseSection();
        ensureProcessSection();
        ensureBeginSection();
        removeFooter();
        ensureFooterSection();
        ensureHeroImage();
        ensureLogo();
        observeLogo();
        ensureSocialLinks();
        ensureRemoveRetreatsService();
      } catch (e) {}
      ensureTitle();
      observeTitle();
    }

    observeTitle();
    document.addEventListener("DOMContentLoaded", syncPage);
    window.addEventListener("load", syncPage);
    [250, 750, 1500, 3000, 5000].forEach(function (delay) {
      setTimeout(syncPage, delay);
    });

    var root = document.getElementById("__next");
    if (root) {
      new MutationObserver(syncPage).observe(root, {
        childList: true,
        subtree: true,
      });
    }
  })();
</script>
